<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | James Damasco</title>

    <meta name="theme-color" content="#f8f7fc" />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="404.css" />

</head>

<body>
    <header class="navbar">
        <a class="logo" href="/" aria-label="James Damasco home">
            James <span>Damasco.</span>
        </a>
        <a href="/" class="nav-link">Back to Home</a>
    </header>
    <main>
        <section class="error-container" aria-labelledby="error-title">
            <div class="error-illustration" aria-hidden="true">
                <div class="orbit"></div>
                <div class="orbit second"></div>
                <div class="error-number">
                    <span>4</span>
                    <span>0</span>
                    <span>4</span>
                </div>
            </div>
            <div class="eyebrow">
                <span class="status-dot"></span>
                ERROR 404
            </div>
            <h1 id="error-title">Oops! Page not found.</h1>
            <p class="description">
                The page you're looking for may have been moved, removed, or never existed. Don't worry, let's get you
                back on track.
            </p>
            <div class="actions">
                <a class="button button-primary" href="/">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="m3 10 9-7 9 7" />
                        <path d="M5 9v11h14V9" />
                        <path d="M9 20v-7h6v7" />
                    </svg>
                    Back to Home
                </a>
                <button class="button button-secondary" id="backButton" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="m12 19-7-7 7-7" />
                        <path d="M19 12H5" />
                    </svg>
                    Go Back
                </button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; <span id="year"></span><strong> James Damasco</strong> | All rights reserved.</p>
    </footer>
</body>
<script src="error.js"></script>

</html>
